global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cloudguard
    metrics_path: /metrics
    static_configs:
      # docker compose: backend:8000 · backend running natively on the host: host.docker.internal:8000
      - targets: ["backend:8000"]
    # If PROMETHEUS_TOKEN is set on the backend, uncomment and use the same token:
    # authorization:
    #   type: Bearer
    #   credentials: "<token>"
